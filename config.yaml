dataset: PKU            # PKU | TSU

mediapipe:
  model_path: "models/pose_landmarker_heavy.task"   # Tasks API (lite/full/heavy)
  num_poses: 1
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  static_image_mode: false

yolo:
  model_name: "yolov26x.pt"
  batch_size: 16
  conf_threshold: 0.2
  iou_threshold: 0.7
  max_detections: 2
  tracker: "iou"

preprocessing:
  resize:
    enabled: true
    width: 640
    height: 640
    keep_ratio: true
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: 8
  gamma:
    enabled: true
    value: 0.8
  denoise:
    enabled: true
    method: "bilateral"   # hoac "gaussian"
    strength: 5

thresholds:
  confidence: 0.2        # nguong visibility de retry
  max_nan_ratio: 0.45     # ti le joint NaN toi da de frame duoc coi la hop le

validator:
  max_retries: 2

interpolation:
  max_gap: 3             # chuoi loi <= max_gap frame thi noi suy, lon hon giu NaN

temporal:
  empty_run_frames: 30   # chuoi frame trong >= N -> thuc su khong nguoi (TN)
  neighbor_conf: null        # conf lan can "cao" de ket luan FN; null = thresholds.confidence
  bbox_interp_max_gap: 10  # chi noi suy bbox cho chuoi FN ngan hon N frame

scaling:
  enabled: true          # chuan hoa ty le: chia cho mean |SpineMid - SpineBase|
  root_idx: 0            # SpineBase
  spine_idx: 1           # SpineMid

pose:
  bbox_buffer_ratio: 0.1 # Them buffer 10% moi canh khi crop bbox

chunk:
  max_actions_per_chunk: 5

pku:
  interactive_action_ids: [12, 14, 16, 18, 21, 24, 26, 27]
  video_ext: ".avi"
  label_ext: ".txt"

tsu:
  video_ext: ".mp4"
  has_header: true
  event_column: 0
  start_column: 1
  end_column: 2
  event_map: {}          # {"event_name": action_id}; de trong = giu nguyen event goc
  event_mapping_path: "event_mapping.csv"  # file anh xa event TSU co dinh (53 events)

output:
  coordinate_mode: "world"   # world (met, goc mid-hip) | image (normalized 0-1)
  save_2d_in_jsonl: true     # luu landmarks 2D normalized vao jsonl cho demo overlay

paths:
  video_dir: "D:/Downloads/ĐATN/RGB_PKUMMDv1"
  output_dir: "D:/Downloads/ĐATN/outputs_pose"
  log_dir: "logs"
  failed_frames_dir: "failed_frames"
  annotation_dir: "D:/Downloads/ĐATN/PKU-MMD/Label_PKUMMD"

runtime:
  num_workers: 10             # Thiet lap > 1 de chay song song nhieu video (luu y VRAM)
  max_segments_per_video: null   # null = full; dat so nho de test nhanh tren CPU
  max_chunks_per_video: null     # null = full; gioi han so chunk xu ly tren moi video
  log_level: "INFO"

detection:
  output_dir: "D:/Downloads/ĐATN/outputs_detection"  # root chua PKU/ va TSU/
  retry:
    max_retries: 2
    imgsz_retry: 1280        # imgsz khi retry 1 (mac dinh YOLO 640)
    tta: true               # Test Time Augmentation khi retry 1
    brightness_delta: 30     # tang sang khi retry 2 (0 = tat)
    clahe_on_retry: true    # bat CLAHE khi retry 2

compare_paths:
  gt_dir: "D:/Downloads/ĐATN/PKU-MMD/Skeleton"
  ext_dir: "D:/Downloads/ĐATN/outputs_pose/PKU"
  output_dir: "outputs/compare_results"

alignment:
  align_root: true      # Set to true to translate the root joint (SpineBase) to (0,0,0) before comparison
  root_joint_idx: 0     # 0 is SpineBase in NTU 25-joint format

matching:
  match_by_distance: true # Set to true to automatically match Person 1 & Person 2 between GT and Extracted to minimize distance

visualization:
  plot_per_joint_mpjpe: true
  plot_time_series: true
