# =============================================================
# pku_v2.yaml — PKU-MMD Version 2 dataset config
# Extends base.yaml.
# PKU v2 is assumed to already contain only daily actions;
# no interaction filter step is required.
# =============================================================
extends: base.yaml

dataset: pku_v2
video_ext: .avi
annotation: pku_label   # same format as v1: label,start,end,confidence

# ------------------------------------------------------------------
# Module 2 — pose pipeline paths
# ------------------------------------------------------------------
# Video directory (set to Drive path on Colab)
video_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/videos/PKUMMDv2/Data/RGB_VIDEO_v2

# Label directory
segments_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/skeletons/PKU/Label_PKUMMD_v2

# Actions reference file
actions_xlsx: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/skeletons/PKU/Actions_v2.xlsx

# Split files
split_cross_subject: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/skeletons/PKU/cross-subject_v2.txt
split_cross_view: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/skeletons/PKU/cross-view_v2.txt

# Output skeleton samples
out_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/skeletons_25/PKU_v2

output:
  num_persons: 1
