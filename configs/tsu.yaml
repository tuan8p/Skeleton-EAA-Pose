# =============================================================
# tsu.yaml — Toyota Smarthome Untrimmed (TSU) dataset config
# Extends base.yaml.
# TSU has no interaction filter step.
# =============================================================
extends: base.yaml

dataset: tsu
video_ext: .mp4
# annotation: each subject has a folder; inside are .csv files
# with fields: event, start_frame, end_frame
annotation: tsu_csv

# ------------------------------------------------------------------
# Module 2 — pose pipeline paths
# ------------------------------------------------------------------
# Video directory (set to Drive path on Colab)
video_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/videos/TSU/Videos_mp4

# Annotation directory (structure: Annotation_v1.0/<subject_id>/<sample>.csv)
segments_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/rawdatasets/skeletons/TSU/Annotation_v1.0

# Output skeleton samples
out_dir: /content/drive/MyDrive/ĐACN-TN_datasets/ĐATN/skeletons_25/TSU

# TSU: typically 1 main person
output:
  num_persons: 1
