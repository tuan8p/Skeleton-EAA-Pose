# Config test local TSU (CPU) - 1 video mau P02T01C06
dataset: TSU

mediapipe:
  model_path: "models/pose_landmarker_full.task"
  num_poses: 1
  min_detection_confidence: 0.2
  min_presence_confidence: 0.2
  min_tracking_confidence: 0.2
  static_image_mode: false

yolo:
  model_name: "yolo26x.pt"
  conf_threshold: 0.2
  iou_threshold: 0.7
  max_detections: 2
  tracker: "deepocsort"

preprocessing:
  resize:
    enabled: true
    width: 640
    height: 640
    keep_ratio: true
  clahe:
    enabled: true
  gamma:
    enabled: true
  denoise:
    enabled: true

thresholds:
  confidence: 0.2
  max_nan_ratio: 0.45

validator:
  max_retries: 2

interpolation:
  max_gap: 3

temporal:
  empty_run_frames: 30
  neighbor_conf: null
  bbox_interp_max_gap: 30

scaling:
  enabled: true
  root_idx: 0
  spine_idx: 1

chunk:
  max_actions_per_chunk: 5

tsu:
  video_ext: ".mp4"
  has_header: true
  event_column: 0
  start_column: 1
  end_column: 2
  event_map: {}
  event_mapping_path: "D:/Downloads/ĐATN/event_mapping.csv"

depth:
  enabled: false

output:
  coordinate_mode: "world"   # BlazePose world (met, goc mid-hip)
  save_2d_in_jsonl: true

paths:
  video_dir: "D:/Downloads/ĐATN/TSU"
  output_dir: "out_tsu/skeletons"
  log_dir: "out_tsu/logs"
  failed_frames_dir: "out_tsu/failed_frames"
  annotation_dir: "D:/Downloads/ĐATN/TSU"
  depth_dir: ""

runtime:
  max_segments_per_video: 2
  max_chunks_per_video:      # null = full; gioi han so chunk xu ly tren moi video
  log_level: "INFO"

detection:
  output_dir: "out/outputs_detect"
  retry:
    max_retries: 2
    imgsz_retry: 1280
    tta: true
    brightness_delta: 30
    clahe_on_retry: true
